<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Maxamed-Bulshaawi — front-end developer</title>
  <desc id="desc">A rich midnight-blue banner with luminous route lines and abstract city forms, representing useful digital systems.</desc>
  <defs>
